[tox]
envlist = py39, py310, py311, py312, py313, py314, py315, py39-cov, py310-cov, py311-cov, py312-cov, py313-cov, py314-cov, py315-cov, lint, regen, docs
isolated_build = true

[gh-actions]
python =
    3.9: py39-cov, lint, regen, docs
    3.10: py310-cov
    3.11: py311-cov
    3.12: py312-cov
    3.13: py313-cov
    3.14: py314-cov
    3.15: py315-cov

[testenv]
setenv = COVERAGE_FILE={toxworkdir}/.coverage.{envname}

description =
    Run tests under {basepython}
    cov: with coverage

commands = make PYTEST_ARGS='{posargs} --junitxml={toxworkdir}/{envname}_integration.xml' check
commands_cov= make PYTEST_ARGS='{posargs} --junitxml={toxworkdir}/{envname}_integration.xml \
              --cov-report=xml:{toxworkdir}/coverage.xml' pycoverage
extras = test
allowlist_externals = make

[testenv:lint]
description = lint code in {basepython}
extras = lint
commands = make lint

[testenv:regen]
description = regenerate metaparser {basepython}
deps = black
commands = make regen-metaparser
           make regen-metaparser

[testenv:py39-cov]
usedevelop = True
commands = {[testenv]commands_cov}

[coverage:run]
source = src/pegen
branch = True
parallel = True
omit =
    tests/*
    *__init__.py

[coverage:report]
skip_covered = True
show_missing = True

[testenv:docs]
description = build the documentation
extras = docs
commands = make docs
